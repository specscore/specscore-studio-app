name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm exec nx test app

      - name: Check Cloudflare assets-only deploy config
        run: node --test tools/*.test.mjs

      - name: Build production bundle
        run: pnpm exec nx build app --configuration=production

      - name: Assert the deploy dir has the SPA fallback and headers
        # Workers Builds runs only `nx build app` then `wrangler deploy` (it ignores
        # wrangler build.command), so the build itself must emit these files.
        run: |
          test -s dist/apps/app/browser/index.html
          test -s dist/apps/app/browser/app/index.html
          grep -qx '  Referrer-Policy: strict-origin' dist/apps/app/browser/_headers
          cmp dist/apps/app/browser/index.html dist/apps/app/browser/app/index.html
